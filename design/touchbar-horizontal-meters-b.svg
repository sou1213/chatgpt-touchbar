<svg xmlns="http://www.w3.org/2000/svg" width="1245" height="860" viewBox="0 0 1245 860">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#161616" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, sans-serif; }
      .title { font-size: 27px; font-weight: 750; fill: #161616; letter-spacing: -0.4px; }
      .subtitle { font-size: 13px; font-weight: 450; fill: #77777d; }
      .section { font-size: 14px; font-weight: 720; fill: #161616; letter-spacing: 0.5px; }
      .note { font-size: 12px; font-weight: 450; fill: #77777d; }
      .tb-main { font-size: 11px; font-weight: 650; fill: #f7f7f7; }
      .tb-value { font-size: 12px; font-weight: 720; fill: #f7f7f7; }
      .tb-small { font-size: 9px; font-weight: 550; fill: #8e8e93; }
      .chip { font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1245" height="860" fill="#f4f3f1"/>
  <g class="ui">
    <text class="title" x="40" y="60">Selected Direction — B Horizontal Meters</text>
    <text class="subtitle" x="40" y="86">読み間違いを減らし、最前面のAIプロバイダーに合わせて期間名・残量・リセット時刻を差し替える</text>
    <g transform="translate(1005 39)">
      <rect width="200" height="28" rx="14" fill="#dff8eb"/>
      <circle cx="16" cy="14" r="5" fill="#20a968"/>
      <text class="chip" x="29" y="18" fill="#157649">DIRECTION SELECTED</text>
    </g>

    <!-- Default state -->
    <g filter="url(#shadow)"><rect x="40" y="116" width="1165" height="166" rx="16" fill="#fff"/></g>
    <text class="section" x="60" y="150">DEFAULT · CHATGPT / CODEX</text>
    <text class="note" x="1185" y="150" text-anchor="end">通常状態：残量50%以上</text>
    <rect x="80" y="184" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 190)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/>
      <text class="tb-main" x="8" y="13" text-anchor="middle">✦</text>
      <text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="192" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="204" y="203">5h</text>
    <rect x="226" y="196" width="190" height="6" rx="3" fill="#303033"/>
    <rect x="226" y="196" width="143" height="6" rx="3" fill="#39d98a"/>
    <text class="tb-value" x="426" y="205">75%</text>
    <text class="tb-small" x="486" y="203">Week</text>
    <rect x="526" y="196" width="190" height="6" rx="3" fill="#303033"/>
    <rect x="526" y="196" width="112" height="6" rx="3" fill="#39d98a"/>
    <text class="tb-value" x="726" y="205">59%</text>
    <text class="tb-small" x="812" y="202">reset 12:59</text>
    <rect x="944" y="188" width="1" height="22" fill="#242427"/>
    <g fill="#6f6f74"><circle cx="1012" cy="199" r="3"/><circle cx="1060" cy="199" r="3"/><circle cx="1108" cy="199" r="3"/></g>
    <text class="note" x="80" y="250">表示対象：前面アプリのみ　　数値：残り使用可能量　　右端：macOS Control Strip領域を確保</text>

    <!-- Warning state -->
    <g filter="url(#shadow)"><rect x="40" y="304" width="1165" height="166" rx="16" fill="#fff"/></g>
    <text class="section" x="60" y="338">LOW REMAINING</text>
    <g transform="translate(220 322)"><rect width="86" height="24" rx="12" fill="#fff2c7"/><circle cx="14" cy="12" r="4" fill="#e6a700"/><text class="chip" x="25" y="16" fill="#8b6200">WARNING</text></g>
    <text class="note" x="1185" y="338" text-anchor="end">各メーターを個別に状態色へ変更</text>
    <rect x="80" y="372" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 378)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/><text class="tb-main" x="8" y="13" text-anchor="middle">✦</text><text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="380" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="204" y="391">5h</text>
    <rect x="226" y="384" width="190" height="6" rx="3" fill="#303033"/><rect x="226" y="384" width="68" height="6" rx="3" fill="#f5c84c"/>
    <text class="tb-value" x="426" y="393">36%</text>
    <text class="tb-small" x="486" y="391">Week</text>
    <rect x="526" y="384" width="190" height="6" rx="3" fill="#303033"/><rect x="526" y="384" width="27" height="6" rx="3" fill="#ff5d5d"/>
    <text class="tb-value" x="726" y="393">14%</text>
    <text class="tb-small" x="812" y="390">reset 12:59</text>
    <rect x="944" y="376" width="1" height="22" fill="#242427"/>
    <g fill="#6f6f74"><circle cx="1012" cy="387" r="3"/><circle cx="1060" cy="387" r="3"/><circle cx="1108" cy="387" r="3"/></g>
    <text class="note" x="80" y="438">緑：50%以上　　黄：20–49%　　赤：20%未満。色だけでなく数値も必ず表示する</text>

    <!-- Provider adaptation -->
    <g filter="url(#shadow)"><rect x="40" y="492" width="1165" height="286" rx="16" fill="#fff"/></g>
    <text class="section" x="60" y="526">PROVIDER ADAPTATION</text>
    <text class="note" x="1185" y="526" text-anchor="end">ラベルと値はProvider Adapterから供給</text>

    <rect x="80" y="554" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 560)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/><text class="tb-main" x="8" y="13" text-anchor="middle">C</text><text class="tb-main" x="22" y="13">Claude Code</text>
    </g>
    <rect x="208" y="562" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="228" y="573">5h</text><rect x="250" y="566" width="180" height="6" rx="3" fill="#303033"/><rect x="250" y="566" width="122" height="6" rx="3" fill="#39d98a"/><text class="tb-value" x="440" y="575">68%</text>
    <text class="tb-small" x="500" y="573">Week</text><rect x="540" y="566" width="180" height="6" rx="3" fill="#303033"/><rect x="540" y="566" width="79" height="6" rx="3" fill="#f5c84c"/><text class="tb-value" x="730" y="575">44%</text>
    <text class="tb-small" x="812" y="572">reset 13:40</text><rect x="944" y="558" width="1" height="22" fill="#242427"/>

    <rect x="80" y="612" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 618)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/><text class="tb-main" x="8" y="13" text-anchor="middle">G</text><text class="tb-main" x="22" y="13">Gemini</text>
    </g>
    <rect x="184" y="620" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="204" y="631">Today</text><rect x="244" y="624" width="180" height="6" rx="3" fill="#303033"/><rect x="244" y="624" width="148" height="6" rx="3" fill="#39d98a"/><text class="tb-value" x="434" y="633">82%</text>
    <text class="tb-small" x="494" y="631">Model</text><rect x="536" y="624" width="180" height="6" rx="3" fill="#303033"/><rect x="536" y="624" width="110" height="6" rx="3" fill="#39d98a"/><text class="tb-value" x="726" y="633">61%</text>
    <text class="tb-small" x="812" y="630">reset 00:00</text><rect x="944" y="616" width="1" height="22" fill="#242427"/>

    <rect x="80" y="670" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 676)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/><text class="tb-main" x="8" y="13" text-anchor="middle">✦</text><text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="678" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="204" y="689">5h</text><rect x="226" y="682" width="190" height="6" rx="3" fill="#303033"/><text class="tb-value" x="426" y="691">—</text>
    <text class="tb-small" x="486" y="689">Week</text><rect x="526" y="682" width="190" height="6" rx="3" fill="#303033"/><text class="tb-value" x="726" y="691">—</text>
    <text class="tb-small" x="812" y="688">usage unavailable</text><rect x="944" y="674" width="1" height="22" fill="#242427"/>
    <text class="note" x="80" y="746">取得不能時は前回値を残さず「—」へ。対象外アプリが前面なら、このカスタム表示自体を終了して標準Touch Barへ戻す</text>

    <text class="subtitle" x="40" y="824">実装フォント：SF Pro / system font　 ·　 Touch Bar本体：1085 × 30pt　 ·　 更新頻度案：30–60秒＋前面アプリ切替時</text>
  </g>
</svg>
