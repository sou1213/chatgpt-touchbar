<svg xmlns="http://www.w3.org/2000/svg" width="1245" height="780" viewBox="0 0 1245 780">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#161616" flood-opacity="0.08"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, sans-serif; }
      .title { font-size: 27px; font-weight: 700; fill: #161616; letter-spacing: -0.4px; }
      .subtitle { font-size: 13px; font-weight: 400; fill: #77777d; }
      .card-title { font-size: 14px; font-weight: 700; fill: #161616; letter-spacing: 0.8px; }
      .card-note { font-size: 12px; font-weight: 400; fill: #77777d; }
      .tb-main { font-size: 11px; font-weight: 650; fill: #f7f7f7; }
      .tb-value { font-size: 12px; font-weight: 700; fill: #f7f7f7; }
      .tb-small { font-size: 9px; font-weight: 500; fill: #8e8e93; }
      .tb-center { font-size: 7px; font-weight: 650; fill: #f7f7f7; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1245" height="780" fill="#f4f3f1"/>
  <g class="ui">
    <text class="title" x="40" y="62">Touch Bar — AI Usage</text>
    <text class="subtitle" x="40" y="87">ChatGPT / Codex が最前面の間だけ表示  ·  例：5時間枠 75%残 / 週次枠 59%残</text>

    <!-- Concept A -->
    <g filter="url(#shadow)">
      <rect x="40" y="118" width="1165" height="170" rx="16" fill="#ffffff"/>
    </g>
    <text class="card-title" x="60" y="151">A  DUAL RINGS</text>
    <text class="card-note" x="1185" y="151" text-anchor="end">参照画像に最も近い · 2つの期間を同時表示</text>
    <rect x="80" y="186" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 192)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/>
      <text class="tb-main" x="8" y="13" text-anchor="middle">✦</text>
      <text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="194" width="1" height="14" fill="#303033"/>
    <g transform="translate(204 190)">
      <circle cx="11" cy="11" r="9" fill="none" stroke="#303033" stroke-width="4"/>
      <circle cx="11" cy="11" r="9" fill="none" stroke="#39d98a" stroke-width="4" stroke-linecap="round" stroke-dasharray="42.41 56.55" transform="rotate(-90 11 11)"/>
      <text class="tb-center" x="11" y="11">5h</text>
      <text class="tb-value" x="29" y="15">75%</text>
    </g>
    <g transform="translate(292 190)">
      <circle cx="11" cy="11" r="9" fill="none" stroke="#303033" stroke-width="4"/>
      <circle cx="11" cy="11" r="9" fill="none" stroke="#39d98a" stroke-width="4" stroke-linecap="round" stroke-dasharray="33.36 56.55" transform="rotate(-90 11 11)"/>
      <text class="tb-center" x="11" y="11">W</text>
      <text class="tb-value" x="29" y="15">59%</text>
    </g>
    <text class="tb-small" x="812" y="204">5h reset 12:59</text>
    <rect x="944" y="190" width="1" height="22" fill="#242427"/>
    <g fill="#6f6f74" opacity="0.8">
      <circle cx="1012" cy="201" r="3"/><circle cx="1060" cy="201" r="3"/><circle cx="1108" cy="201" r="3"/>
    </g>
    <text class="card-note" x="80" y="256">強み：一目で残量が分かる　　注意：リング内の期間ラベルは小さい</text>

    <!-- Concept B -->
    <g filter="url(#shadow)">
      <rect x="40" y="310" width="1165" height="170" rx="16" fill="#ffffff"/>
    </g>
    <text class="card-title" x="60" y="343">B  HORIZONTAL METERS</text>
    <g transform="translate(286 327)">
      <rect width="104" height="24" rx="12" fill="#dff8eb"/>
      <circle cx="14" cy="12" r="4" fill="#20a968"/>
      <text x="25" y="16" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="10" font-weight="700" fill="#157649">RECOMMENDED</text>
    </g>
    <text class="card-note" x="1185" y="343" text-anchor="end">数値と期間を最も明確に読める</text>
    <rect x="80" y="378" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 384)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/>
      <text class="tb-main" x="8" y="13" text-anchor="middle">✦</text>
      <text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="386" width="1" height="14" fill="#303033"/>
    <text class="tb-small" x="204" y="397">5h</text>
    <rect x="226" y="390" width="190" height="6" rx="3" fill="#303033"/>
    <rect x="226" y="390" width="143" height="6" rx="3" fill="#39d98a"/>
    <text class="tb-value" x="426" y="399">75%</text>
    <text class="tb-small" x="486" y="397">Week</text>
    <rect x="526" y="390" width="190" height="6" rx="3" fill="#303033"/>
    <rect x="526" y="390" width="112" height="6" rx="3" fill="#39d98a"/>
    <text class="tb-value" x="726" y="399">59%</text>
    <text class="tb-small" x="812" y="396">reset 12:59</text>
    <rect x="944" y="382" width="1" height="22" fill="#242427"/>
    <g fill="#6f6f74" opacity="0.8">
      <circle cx="1012" cy="393" r="3"/><circle cx="1060" cy="393" r="3"/><circle cx="1108" cy="393" r="3"/>
    </g>
    <text class="card-note" x="80" y="448">選定理由：誤読が少なく、ChatGPT / Claude Code / Geminiの異なる指標名にも展開しやすい</text>

    <!-- Concept C -->
    <g filter="url(#shadow)">
      <rect x="40" y="502" width="1165" height="190" rx="16" fill="#ffffff"/>
    </g>
    <text class="card-title" x="60" y="535">C  HYBRID</text>
    <text class="card-note" x="1185" y="535" text-anchor="end">主枠を大きく、週次枠を補助表示</text>
    <rect x="80" y="570" width="1085" height="30" rx="6" fill="#050505"/>
    <g transform="translate(96 576)">
      <circle cx="8" cy="9" r="7" fill="#171719" stroke="#343438"/>
      <text class="tb-main" x="8" y="13" text-anchor="middle">✦</text>
      <text class="tb-main" x="22" y="13">ChatGPT</text>
    </g>
    <rect x="184" y="578" width="1" height="14" fill="#303033"/>
    <g transform="translate(204 574)">
      <circle cx="11" cy="11" r="9" fill="none" stroke="#303033" stroke-width="4"/>
      <circle cx="11" cy="11" r="9" fill="none" stroke="#39d98a" stroke-width="4" stroke-linecap="round" stroke-dasharray="42.41 56.55" transform="rotate(-90 11 11)"/>
      <text class="tb-center" x="11" y="11">5h</text>
      <text class="tb-value" x="29" y="15">75%</text>
    </g>
    <text class="tb-small" x="304" y="589">Week</text>
    <rect x="344" y="582" width="180" height="6" rx="3" fill="#303033"/>
    <rect x="344" y="582" width="106" height="6" rx="3" fill="#39d98a"/>
    <text class="tb-value" x="534" y="591">59%</text>
    <text class="tb-small" x="812" y="588">5h reset 12:59</text>
    <rect x="944" y="574" width="1" height="22" fill="#242427"/>
    <g fill="#6f6f74" opacity="0.8">
      <circle cx="1012" cy="585" r="3"/><circle cx="1060" cy="585" r="3"/><circle cx="1108" cy="585" r="3"/>
    </g>
    <text class="card-note" x="80" y="640">強み：5時間枠を最優先しながら週次残量も保持。視認性・情報量・参照画像らしさのバランスが良い</text>
    <text class="card-note" x="80" y="665">推奨挙動：前面アプリに応じてProvider Adapterを切替。データ取得不可時は「—」表示、前面対象外では標準Touch Barへ戻す</text>

    <g transform="translate(40 728)">
      <text class="subtitle" x="0" y="0">状態色：</text>
      <circle cx="58" cy="-4" r="5" fill="#39d98a"/><text class="subtitle" x="69" y="0">50%以上</text>
      <circle cx="144" cy="-4" r="5" fill="#f5c84c"/><text class="subtitle" x="155" y="0">20–49%</text>
      <circle cx="232" cy="-4" r="5" fill="#ff5d5d"/><text class="subtitle" x="243" y="0">20%未満</text>
      <text class="subtitle" x="1165" y="0" text-anchor="end">バー本体は 1085 × 30pt（実寸想定）</text>
    </g>
  </g>
</svg>
