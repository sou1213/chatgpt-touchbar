name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build macOS release
    runs-on: macos-14
    environment: release
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate version tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.3.0; got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AppBundle/Info.plist)"
          if [[ "${VERSION}" != "${PLIST_VERSION}" ]]; then
            echo "Tag ${VERSION} does not match Info.plist version ${PLIST_VERSION}." >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for secret_name in \
            CERTIFICATE_P12_BASE64 \
            CERTIFICATE_PASSWORD \
            NOTARY_KEY_P8_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "Required release secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done

          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${NOTARY_KEY_ID}.p8"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"

          {
            echo "SIGNING_CERTIFICATE_PATH=${CERTIFICATE_PATH}"
            echo "SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
            echo "CHATGPT_TOUCHBAR_NOTARY_KEY_PATH=${NOTARY_KEY_PATH}"
          } >> "${GITHUB_ENV}"

          printf '%s' "${CERTIFICATE_P12_BASE64}" | /usr/bin/base64 -D > "${CERTIFICATE_PATH}"
          printf '%s' "${NOTARY_KEY_P8_BASE64}" | /usr/bin/base64 -D > "${NOTARY_KEY_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | awk '/Developer ID Application/{print $2; exit}')"
          if [[ -z "${SIGNING_IDENTITY}" ]]; then
            echo "No Developer ID Application identity was found in the certificate." >&2
            exit 1
          fi

          {
            echo "CHATGPT_TOUCHBAR_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "CHATGPT_TOUCHBAR_NOTARIZE=true"
            echo "CHATGPT_TOUCHBAR_NOTARY_KEY_ID=${NOTARY_KEY_ID}"
            echo "CHATGPT_TOUCHBAR_NOTARY_ISSUER_ID=${NOTARY_ISSUER_ID}"
            echo "SIGNING_KEYCHAIN_PATH=${KEYCHAIN_PATH}"
          } >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize DMG and ZIP
        run: ./scripts/package_release.sh "${GITHUB_REF_NAME}"

      - name: Upload notarization logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-logs-${{ github.ref_name }}
          path: dist/notarization-logs/*-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChatGPTTouchBar-${{ github.ref_name }}-macOS
          path: dist/release/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Release ${GITHUB_REF_NAME} is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --draft \
              --title "ChatGPT Touch Bar ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/release/* --clobber
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN_PATH}" || true
          fi
          for sensitive_path in \
            "${SIGNING_CERTIFICATE_PATH:-}" \
            "${CHATGPT_TOUCHBAR_NOTARY_KEY_PATH:-}"; do
            if [[ -n "${sensitive_path}" ]]; then
              rm -f -- "${sensitive_path}"
            fi
          done
