name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build application and installer packages
        run: ./scripts/package_release.sh

      - name: Verify package checksums
        run: cd dist/release && /usr/bin/shasum -a 256 -c SHA256SUMS.txt
