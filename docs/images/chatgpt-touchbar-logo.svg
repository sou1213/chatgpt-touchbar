<svg xmlns="http://www.w3.org/2000/svg" width="760" height="124" viewBox="0 0 760 124" role="img" aria-labelledby="title description">
  <title id="title">ChatGPT Touch Bar</title>
  <desc id="description">ChatGPT Touch Bar project logo with compact five-hour and weekly usage meters.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141718"/>
      <stop offset="0.55" stop-color="#0b0e0f"/>
      <stop offset="1" stop-color="#10211c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44d7a4"/>
      <stop offset="1" stop-color="#76e5bb"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#ffe06f"/>
    </linearGradient>
    <mask id="chatgpt-mark" x="22" y="22" width="36" height="36" maskUnits="userSpaceOnUse" mask-type="alpha">
      <image x="22" y="22" width="36" height="36" href="data:image/png;base64,"/>
    </mask>
  </defs>

  <rect x="1" y="1" width="758" height="122" rx="27" fill="url(#panel)" stroke="#303635" stroke-width="2"/>
  <rect x="10" y="10" width="740" height="104" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>

  <g transform="translate(28 22)">
    <circle cx="40" cy="40" r="39" fill="#1b1f20" stroke="#444b49"/>
    <rect x="22" y="22" width="36" height="36" fill="#f3f6f5" mask="url(#chatgpt-mark)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="124" y="59" fill="#f6f8f7" font-size="34" font-weight="720" letter-spacing="-1.2">ChatGPT</text>
    <text x="125" y="86" fill="#8f9794" font-size="13" font-weight="650" letter-spacing="3.7">TOUCH BAR</text>
    <rect x="124" y="96" width="184" height="3" rx="1.5" fill="url(#accent)"/>

    <rect x="342" y="29" width="1" height="66" fill="#363b3a"/>

    <g transform="translate(374 30)">
      <text x="0" y="16" fill="#9ca29f" font-size="14" font-weight="600">5h</text>
      <rect x="28" y="7" width="116" height="10" rx="5" fill="#353938"/>
      <rect x="28" y="7" width="91" height="10" rx="5" fill="url(#accent)"/>
      <text x="155" y="17" fill="#f4f6f5" font-size="17" font-weight="700">82%</text>

      <text x="0" y="56" fill="#9ca29f" font-size="14" font-weight="600">Week</text>
      <rect x="48" y="47" width="116" height="10" rx="5" fill="#353938"/>
      <rect x="48" y="47" width="55" height="10" rx="5" fill="url(#warm)"/>
      <text x="175" y="57" fill="#f4f6f5" font-size="17" font-weight="700">47%</text>
    </g>

    <text x="692" y="66" fill="#5ce0ad" font-size="18" font-weight="700">●</text>
  </g>
</svg>
